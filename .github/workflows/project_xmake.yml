name: project_xmake tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/project_xmake.yml
      - packages/native_toolchain_xmake/**
      - example/project_xmake/**
      - pubspec.yaml
      - pubspec.lock
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/project_xmake.yml
      - packages/native_toolchain_xmake/**
      - example/project_xmake/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      DASH__SUPPRESS_ANALYTICS: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.14.0"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        run: |
          dart --version
          xmake --version

      - name: Install Dart dependencies
        shell: bash
        # Resolve the two packages under test without the other Flutter examples.
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          workspace:
            - packages/native_toolchain_xmake
            - example/project_xmake
          YAML
          dart pub get

      # Keep the runner's default shell so Git Bash's link cannot shadow MSVC.
      - name: Test xmake toolchain
        working-directory: packages/native_toolchain_xmake
        run: dart test --concurrency=1 --reporter=expanded

      - name: Test native functionality and CLI linking
        working-directory: example/project_xmake
        run: dart test --concurrency=1 --reporter=expanded
